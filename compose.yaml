name: supportdesk-api
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: supportdesk
    ports:
      - '127.0.0.1:5542:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d supportdesk']
      interval: 2s
      timeout: 3s
      retries: 30
  db-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-supportdesk}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Define POSTGRES_TEST_PASSWORD en .env}
      POSTGRES_DB: supportdesk_test
    ports:
      - '127.0.0.1:5544:5432'
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d supportdesk_test']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
  test-data:
